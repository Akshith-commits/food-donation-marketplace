<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bridgePlateFavicon" x1="6" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="mealCenterFavicon" x1="18" y1="18" x2="30" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background subtle rounded container -->
  <rect width="48" height="48" rx="12" fill="#0c0e12" />
  
  <!-- Bridge Arch -->
  <path d="M 7 21 C 13 8, 35 8, 41 21" stroke="url(#bridgePlateFavicon)" stroke-width="3.6" stroke-linecap="round" />
  
  <!-- Shared Plate / Bowl Curve -->
  <path d="M 10 24 C 12 36, 36 36, 38 24" stroke="url(#bridgePlateFavicon)" stroke-width="3.6" stroke-linecap="round" />
  
  <!-- Hospitality Rim -->
